name: SEO prerender regression checks

on:
  pull_request:
    paths:
      - 'scripts/prerender.js'
      - 'scripts/public-content.js'
      - 'scripts/build-public-content.js'
      - 'scripts/generate-sitemap.js'
      - 'scripts/generate-feed.js'
      - 'scripts/verify-static-routes.js'
      - 'scripts/utils/strict-xml.js'
      - 'src/lib/public-pagination.*'
      - 'src/lib/public-collections.ts'
      - 'src/pages/**'
      - 'src/lib/content-selects.ts'
      - 'scripts/render-markdown.js'
      - 'src/lib/markdown-shared.*'
      - 'src/components/markdown/GfmMarkdown.tsx'
      - 'src/main.tsx'
      - 'src/index.css'
      - 'src/pages/ProjectDetail.tsx'
      - 'tests/build.mjs'
      - 'tests/public-content.test.mjs'
      - 'tests/public-pagination.test.mjs'
      - 'tests/strict-xml.test.mjs'
      - 'tests/prerender-browser.mjs'
      - 'package*.json'
      - '.github/workflows/seo-prerender-check.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/render-markdown.js
          node --check scripts/public-content.js
          node --check scripts/build-public-content.js
          node --check scripts/generate-sitemap.js
          node --check scripts/generate-feed.js
          node --check scripts/verify-static-routes.js
          node --check scripts/utils/strict-xml.js
          node --check src/lib/public-pagination.js
          node --check scripts/prerender.js
          node --check src/lib/markdown-shared.js
          node --check tests/build.mjs
          node --check tests/public-content.test.mjs
          node --check tests/public-pagination.test.mjs
          node --check tests/strict-xml.test.mjs
      - name: Run Node regression tests
        run: node --test tests/*.test.mjs
      - name: Run static Markdown and generated-page regression tests
        run: node tests/build.mjs
      - name: Install Chromium for JS/no-JS smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify browser rendering and React root replacement
        run: node tests/prerender-browser.mjs
